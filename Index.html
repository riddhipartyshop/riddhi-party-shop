<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#5b21b6">
<title>Riddhi Party Shop</title>
<style>
body{margin:0;font-family:Arial;background:#f7f3ff;color:#222}
header{background:#5b21b6;color:white;padding:18px;text-align:center}
h1{margin:0;font-size:25px}
.search{margin:15px;padding:12px;width:calc(100% - 54px);border:1px solid #ddd;border-radius:10px}
#products{padding:15px}
.card{background:white;padding:12px;margin:10px 0;border-radius:12px;box-shadow:0 2px 8px #ddd}
.card img{width:100%;height:180px;object-fit:contain}
button{background:#5b21b6;color:white;border:0;padding:10px 15px;border-radius:8px}
</style>
</head>

<body>

<header>
<h1>Riddhi Party Shop</h1>
<p>Gifts • Toys • Birthday Decoration</p>
</header>

<input class="search" placeholder="Search products...">

<div id="products">
<p>Products yahan dikhenge...</p>
</div>

</body>
</html>
