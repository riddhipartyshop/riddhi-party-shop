<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<meta name="description" content="Riddhi Party Shop - Gifts, Toys, Birthday Decoration and Party Supplies">
<link rel="manifest" href="manifest.json">
<title>Riddhi Party Shop</title>

<style>
:root{
--purple:#7c3aed;
--purple2:#9333ea;
--light:#f6f3ff;
--text:#17131f;
--muted:#77717f;
--line:#e9e4f0;
--white:#fff
}
*{box-sizing:border-box}
body{
margin:0;
font-family:Arial,sans-serif;
background:#faf9fc;
color:var(--text);
padding-bottom:76px
}
button{border:0;cursor:pointer;font-family:inherit}
.app{max-width:600px;margin:auto;padding:12px 14px}

.top{
display:flex;
align-items:center;
gap:10px;
padding:8px 0
}
.logo{
width:42px;height:42px;border-radius:13px;
background:linear-gradient(135deg,var(--purple),var(--purple2));
display:grid;place-items:center;
color:#fff;font-size:22px
}
.brand{font-weight:800;font-size:19px}
.small{font-size:12px;color:var(--muted)}

.search{
display:flex;
gap:8px;
background:#fff;
border:1px solid var(--line);
border-radius:14px;
padding:8px 12px;
margin:8px 0 12px;
box-shadow:0 2px 10px #00000008
}
.search input{
border:0;outline:0;width:100%;
background:transparent;font-size:15px
}

.hero{
background:linear-gradient(135deg,var(--purple),var(--purple2));
color:#fff;border-radius:20px;
padding:20px;margin:10px 0 16px;
display:flex;align-items:center;
justify-content:space-between;gap:10px
}
.hero h1{margin:0 0 6px;font-size:24px}
.hero p{margin:0 0 14px;font-size:13px;opacity:.9}
.heroBtn{
background:#fff;color:var(--purple);
font-weight:800;padding:10px 14px;border-radius:12px
}

.sectionHead{
display:flex;
justify-content:space-between;
align-items:center;
margin:18px 0 10px
}
.sectionHead h2{font-size:18px;margin:0}
.link{
color:var(--purple);
font-weight:700;
background:none
}

.catRow{
display:flex;
gap:10px;
overflow:auto;
padding-bottom:5px
}
.catChip{
min-width:88px;
background:#fff;
border:1px solid var(--line);
border-radius:15px;
padding:11px 8px;
text-align:center
}
.catChip b{
display:block;
font-size:25px;
margin-bottom:5px
}
.catChip span{font-size:12px}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px
}
.card{
background:#fff;
border:1px solid var(--line);
border-radius:16px;
padding:10px;
box-shadow:0 2px 10px #00000007
}
.pic{
height:125px;
border-radius:12px;
background:var(--light);
display:grid;
place-items:center;
font-size:48px
}
.card h3{
font-size:14px;
margin:9px 0 5px;
line-height:1.25
}
.price{font-weight:800;font-size:17px}
.old{
text-decoration:line-through;
color:#aaa;
font-size:12px;
margin-left:5px
}
.add{
width:100%;
margin-top:9px;
background:var(--purple);
color:#fff;
padding:9px;
border-radius:10px;
font-weight:700
}

.page{display:none}
.page.active{display:block}

.pageTitle{
display:flex;
align-items:center;
gap:10px;
margin:8px 0 18px
}
.pageTitle h2{margin:0}
.back{
background:#eee8ff;
color:var(--purple);
width:40px;height:40px;
border-radius:12px;
font-size:21px
}

.categoryGrid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px
}
.categoryCard{
background:#fff;
border:1px solid var(--line);
border-radius:18px;
padding:22px 10px;
text-align:center;
box-shadow:0 3px 12px #00000008
}
.categoryCard .emoji{font-size:45px}
.categoryCard strong{
display:block;
margin-top:9px
}

.empty{
text-align:center;
padding:35px 10px;
color:var(--muted)
}

.notice{
background:#f3edff;
color:#5b21b6;
padding:10px 12px;
border-radius:12px;
font-size:12px;
margin:10px 0
}

.modalWrap{
position:fixed;
inset:0;
background:#0008;
display:none;
align-items:flex-end;
z-index:20
}
.modalWrap.show{display:flex}
.modal{
background:#fff;
width:100%;
max-width:600px;
margin:auto auto 0;
border-radius:22px 22px 0 0;
padding:20px;
max-height:85vh;
overflow:auto
}
.modalHead{
display:flex;
justify-content:space-between;
align-items:center
}
.modalHead h2{margin:0}
.close{
background:#f1eef5;
border-radius:10px;
padding:8px 12px
}

.cartItem{
display:flex;
justify-content:space-between;
gap:10px;
padding:12px 0;
border-bottom:1px solid var(--line)
}
.qty{
display:flex;
align-items:center;
gap:8px
}
.qty button{
width:28px;height:28px;
border-radius:8px;
background:#eee8ff;
color:var(--purple);
font-size:18px
}
.total{
font-size:19px;
font-weight:800;
padding:16px 0
}
.pay{
display:grid;
gap:8px
}
.pay label{
border:1px solid var(--line);
padding:12px;
border-radius:12px
}
.checkout{
width:100%;
background:var(--purple);
color:#fff;
padding:12px;
border-radius:12px;
font-weight:800;
margin-top:8px
}
.formInput,.formArea{
width:100%;
padding:11px;
border:1px solid var(--line);
border-radius:10px;
margin:6px 0;
font-family:inherit
}

.bottom{
position:fixed;
bottom:0;
left:0;
right:0;
background:#fff;
border-top:1px solid var(--line);
height:68px;
display:flex;
justify-content:center;
z-index:10
}
.bottom button{
flex:1;
max-width:150px;
background:#fff;
color:#777
}
.bottom button.active{
color:var(--purple);
font-weight:800
}
.bottom span{
display:block;
font-size:11px;
margin-top:3px
}

@media(min-width:560px){
.bottom{
left:50%;
transform:translateX(-50%);
width:600px;
border-radius:18px 18px 0 0
}
.grid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>

<body>

<div class="app">

<!-- HOME -->
<div id="homePage" class="page active">

<div class="top">
<div class="logo">🎈</div>
<div>
<div class="brand">Riddhi Party Shop</div>
<div class="small">Gifts • Toys • Birthday Decoration</div>
</div>
</div>

<div class="search">
🔎
<input
id="search"
placeholder="Search balloons, toys, gifts..."
oninput="renderHome()">
</div>

<div class="hero">
<div>
<h1>Celebrate More 🎉</h1>
<p>Great products at great prices.</p>
<button class="heroBtn" onclick="showOffers()">🔥 Great Prices</button>
</div>
<div style="font-size:58px">🎁</div>
</div>

<div class="sectionHead">
<h2>Shop by category</h2>
<button class="link" onclick="openCategoriesPage()">View All</button>
</div>

<div class="catRow">

<button class="catChip" onclick="openCategory('Decoration')">
<b>🎈</b>
<span>Decoration</span>
</button>

<button class="catChip" onclick="openCategory('Gifts')">
<b>🎁</b>
<span>Gifts</span>
</button>

<button class="catChip" onclick="openCategory('Toys')">
<b>🧸</b>
<span>Toys</span>
</button>

<button class="catChip" onclick="openCategory('Party Supplies')">
<b>🎉</b>
<span>Party</span>
</button>

<button class="catChip" onclick="openCategory('Combos')">
<b>📦</b>
<span>Combos</span>
</button>

</div>

<div class="sectionHead">
<h2 id="productHeading">Popular products</h2>
</div>

<div id="products" class="grid"></div>

</div>


<!-- CATEGORY PAGE -->
<div id="categoryPage" class="page">

<div class="pageTitle">
<button class="back" onclick="goHome()">←</button>
<h2>Shop by Category</h2>
</div>

<div class="notice">
Choose a category to see its products.
</div>

<div class="categoryGrid">

<button class="categoryCard" onclick="openCategory('Decoration')">
<div class="emoji">🎈</div>
<strong>Birthday Decoration</strong>
</button>

<button class="categoryCard" onclick="openCategory('Gifts')">
<div class="emoji">🎁</div>
<strong>Gifts</strong>
</button>

<button class="categoryCard" onclick="openCategory('Toys')">
<div class="emoji">🧸</div>
<strong>Toys</strong>
</button>

<button class="categoryCard" onclick="openCategory('Party Supplies')">
<div class="emoji">🎉</div>
<strong>Party Supplies</strong>
</button>

<button class="categoryCard" onclick="openCategory('Combos')">
<div class="emoji">📦</div>
<strong>Combos</strong>
</button>

</div>

</div>

</div>


<!-- MODAL -->
<div id="modalWrap"
class="modalWrap"
onclick="if(event.target===this)closeModal()">

<div id="modal" class="modal"></div>

</div>


<!-- BOTTOM NAV -->
<nav class="bottom">

<button id="navHome" class="active" onclick="goHome()">
🏠
<span>Home</span>
</button>

<button id="navCat" onclick="openCategoriesPage()">
📂
<span>Categories</span>
</button>

<button onclick="openCart()">
🛒
<span>Cart <b id="cartCount"></b></span>
</button>

<button onclick="showOrders()">
📦
<span>Orders</span>
</button>

</nav>


<script>

const products=[

{
id:1,
n:"Birthday Balloon Combo",
p:299,
o:399,
cat:"Combos",
e:"🎈",
keys:"balloon birthday combo decoration"
},

{
id:2,
n:"Premium Gift Hamper",
p:599,
o:799,
cat:"Gifts",
e:"🎁",
keys:"gift hamper present"
},

{
id:3,
n:"Cute Teddy Bear (25 cm)",
p:399,
o:499,
cat:"Toys",
e:"🧸",
keys:"teddy bear toy"
},

{
id:4,
n:"Birthday Decoration Combo",
p:999,
o:1209,
cat:"Decoration",
e:"🎊",
keys:"birthday decoration combo"
},

{
id:5,
n:"Happy Birthday Foil Balloon",
p:99,
o:129,
cat:"Party Supplies",
e:"🎈",
keys:"foil balloon birthday"
},

{
id:6,
n:"Metallic Balloons (10 pcs)",
p:149,
o:199,
cat:"Party Supplies",
e:"🎈",
keys:"metallic balloons balloon"
},

{
id:7,
n:"Birthday Banner",
p:99,
o:129,
cat:"Party Supplies",
e:"🎉",
keys:"banner birthday decoration"
},

{
id:8,
n:"Happy Birthday Cake Topper",
p:79,
o:99,
cat:"Party Supplies",
e:"🎂",
keys:"cake topper birthday"
},

{
id:9,
n:"Number Foil Balloon",
p:99,
o:129,
cat:"Party Supplies",
e:"🔢",
keys:"number foil balloon"
},

{
id:10,
n:"LED Fairy Light (10 Meter)",
p:199,
o:249,
cat:"Decoration",
e:"✨",
keys:"led fairy light decoration"
}

];


let cart=JSON.parse(localStorage.getItem("rps_cart")||"[]");
let currentCat="";


function money(n){
return "₹"+n;
}


function renderHome(){

const q=(document.getElementById("search").value||"")
.trim()
.toLowerCase();

const list=products.filter(x=>{

const text=(x.n+" "+x.cat+" "+x.keys).toLowerCase();

return (!currentCat || x.cat===currentCat)
&&
(!q || text.includes(q));

});


document.getElementById("productHeading").textContent=
currentCat
?currentCat+" Products"
:q
?"Search results"
:"Popular products";


document.getElementById("products").innerHTML=

list.length

?

list.map(x=>`

<article class="card">

<div class="pic">${x.e}</div>

<h3>${x.n}</h3>

<div>
<span class="price">${money(x.p)}</span>
<span class="old">${money(x.o)}</span>
</div>

<button
class="add"
onclick="addToCart(${x.id})">
Add to Cart
</button>

</article>

`).join("")

:

`
<div class="empty" style="grid-column:1/-1">
No products found.
</div>
`;

updateCart();

}


function showPage(id){

document
.querySelectorAll(".page")
.forEach(x=>x.classList.remove("active"));

document
.getElementById(id)
.classList.add("active");

document
.getElementById("navHome")
.classList.toggle("active",id==="homePage");

document
.getElementById("navCat")
.classList.toggle("active",id==="categoryPage");

window.scrollTo(0,0);

}


function goHome(){

currentCat="";

document.getElementById("search").value="";

showPage("homePage");

renderHome();

}


function openCategoriesPage(){

showPage("categoryPage");

}


function openCategory(cat){

currentCat=cat;

document.getElementById("search").value="";

showPage("homePage");

renderHome();

}


function showOffers(){

const offers=products.filter(x=>x.o>x.p);

openModal(`

<div class="modalHead">
<h2>🔥 Great Prices</h2>
<button class="close" onclick="closeModal()">✕</button>
</div>

<p class="small">
Today's discounted products
</p>

${offers.map(x=>`

<div class="cartItem">

<div>
<b>${x.n}</b>
<br>
<span class="price">${money(x.p)}</span>
<span class="old">${money(x.o)}</span>
</div>

<button
class="add"
style="width:auto"
onclick="addToCart(${x.id});closeModal()">
Add
</button>

</div>

`).join("")}

`);

}


function addToCart(id){

const item=cart.find(x=>x.id===id);

if(item)
item.qty++;

else
cart.push({id:id,qty:1});

saveCart();

toast("Added to cart");

}


function saveCart(){

localStorage.setItem(
"rps_cart",
JSON.stringify(cart)
);

updateCart();

}


function updateCart(){

document.getElementById("cartCount").textContent=
cart.reduce((a,x)=>a+x.qty,0)||"";

}


function cartTotal(){

return cart.reduce(

(s,i)=>
s+
(products.find(x=>x.id===i.id)?.p||0)
*i.qty,

0

);

}


function openCart(){

let body=cart.length

?

cart.map(i=>{

let x=products.find(p=>p.id===i.id);

return `

<div class="cartItem">

<div>
<b>${x.n}</b>
<br>
${money(x.p)} × ${i.qty}
</div>

<div class="qty">

<button onclick="changeQty(${x.id},-1)">
−
</button>

<b>${i.qty}</b>

<button onclick="changeQty(${x.id},1)">
+
</button>

</div>

</div>

`;

}).join("")

:

`
<div class="empty">
Your cart is empty 🛒
</div>
`;


openModal(`

<div class="modalHead">
<h2>Your Cart</h2>
<button class="close" onclick="closeModal()">✕</button>
</div>

${body}

${
cart.length
?
`
<div class="total">
Total: ${money(cartTotal())}
</div>

<button
class="checkout"
onclick="checkout()">
Proceed to Checkout
</button>
`
:""
}

`);

}


function changeQty(id,d){

const i=cart.find(x=>x.id===id);

if(!i)return;

i.qty+=d;

if(i.qty<=0)
cart=cart.filter(x=>x.id!==id);

saveCart();

openCart();

}


function checkout(){

openModal(`

<div class="modalHead">
<h2>Checkout</h2>
<button class="close" onclick="closeModal()">✕</button>
</div>

<p>
Total:
<b>${money(cartTotal())}</b>
</p>

<input
id="custName"
class="formInput"
placeholder="Your name">

<input
id="custPhone"
class="formInput"
placeholder="Mobile number"
inputmode="tel">

<textarea
id="custAddress"
class="formArea"
placeholder="Delivery address"
rows="3"></textarea>

<div class="pay">

<label>
<input
type="radio"
name="pay"
value="Cash on Delivery"
checked>
Cash on Delivery
</label>

<label>
<input
type="radio"
name="pay"
value="UPI">
UPI
</label>

<label>
<input
type="radio"
name="pay"
value="Pay at Shop / Pickup">
Pay at Shop / Pickup
</label>

</div>

<p class="small">
UPI payment can be connected after adding your actual shop UPI ID.
</p>

<button
class="checkout"
onclick="placeOrder()">
Place Order
</button>

`);

}


function placeOrder(){

const name=
document.getElementById("custName")
.value.trim();

const phone=
document.getElementById("custPhone")
.value.trim();

const address=
document.getElementById("custAddress")
.value.trim();

const pay=
document.querySelector(
'input[name="pay"]:checked'
)?.value
||"Cash on Delivery";


if(!name||!phone||!address){

alert(
"Please fill name, mobile and address."
);

return;

}


const orders=
JSON.parse(
localStorage.getItem("rps_orders")||"[]"
);


orders.unshift({

id:
"RPS"+
Date.now()
.toString()
.slice(-6),

date:
new Date()
.toLocaleString("en-IN"),

name:name,
phone:phone,
address:address,
pay:pay,
total:cartTotal(),
items:cart

});


localStorage.setItem(
"rps_orders",
JSON.stringify(orders)
);


cart=[];

saveCart();

closeModal();

alert(
"Order saved successfully! We will contact you to confirm."
);

showOrders();

}


function showOrders(){

const orders=
JSON.parse(
localStorage.getItem("rps_orders")||"[]"
);


openModal(`

<div class="modalHead">
<h2>📦 My Orders</h2>
<button class="close" onclick="closeModal()">✕</button>
</div>

${
orders.length

?

orders.map(o=>`

<div class="cartItem">

<div>

<b>Order ${o.id}</b>

<br>

<span class="small">
${o.date}
</span>

<br>

${o.items.map(i=>{

let x=
products.find(p=>p.id===i.id);

return `
${x?.n||"Product"} × ${i.qty}
`;

}).join("<br>")}

</div>

<div>

<b>${money(o.total)}</b>

<br>

<span class="small">
${o.pay}
</span>

</div>

</div>

`).join("")

:

`
<div class="empty">
No orders yet.
</div>
`

}

`);

}


function openModal(html){

document.getElementById("modal").innerHTML=html;

document
.getElementById("modalWrap")
.classList.add("show");

}


function closeModal(){

document
.getElementById("modalWrap")
.classList.remove("show");

}


function toast(msg){

const t=
document.createElement("div");

t.textContent=msg;

t.style.cssText=
"position:fixed;bottom:82px;left:50%;transform:translateX(-50%);background:#17131f;color:white;padding:10px 16px;border-radius:12px;z-index:50;font-size:13px";

document.body.appendChild(t);

setTimeout(
()=>t.remove(),
1600
);

}


renderHome();


if("serviceWorker" in navigator){

navigator.serviceWorker
.register("./sw.js")
.catch(()=>{});

}

</script>

</body>
</html>
