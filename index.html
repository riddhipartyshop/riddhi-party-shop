<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Riddhi Party Shop</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f7f5ff;
  color:#222;
  padding-bottom:75px;
}

button{
  cursor:pointer;
  border:0;
}

header{
  background:#5b21b6;
  color:white;
  padding:14px 18px;
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 2px 8px rgba(0,0,0,.15);
}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.logo{
  font-size:22px;
  font-weight:800;
}

.logo small{
  display:block;
  font-size:11px;
  font-weight:400;
  opacity:.9;
  margin-top:2px;
}

.header-btn{
  background:white;
  color:#5b21b6;
  padding:9px 13px;
  border-radius:10px;
  font-weight:bold;
}

.search-box{
  margin-top:12px;
  background:white;
  border-radius:12px;
  display:flex;
  align-items:center;
  padding:0 12px;
}

.search-box input{
  width:100%;
  border:0;
  outline:0;
  padding:13px 8px;
  font-size:15px;
}

.location-bar{
  background:white;
  margin:10px 12px;
  padding:12px;
  border-radius:12px;
  box-shadow:0 1px 5px rgba(0,0,0,.08);
}

.location-title{
  font-weight:bold;
  color:#5b21b6;
  margin-bottom:5px;
}

.location-text{
  font-size:13px;
  color:#555;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.location-actions{
  display:flex;
  gap:8px;
  margin-top:9px;
}

.location-actions button{
  background:#5b21b6;
  color:white;
  padding:8px 12px;
  border-radius:8px;
  font-size:12px;
}

.hero{
  margin:12px;
  padding:25px 20px;
  border-radius:18px;
  color:white;
  background:linear-gradient(135deg,#5b21b6,#7c3aed);
}

.hero h1{
  font-size:25px;
  margin-bottom:8px;
}

.hero p{
  font-size:14px;
  opacity:.95;
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:4px 12px 12px;
}

.category{
  flex-shrink:0;
  padding:9px 14px;
  background:white;
  border-radius:20px;
  border:1px solid #ddd;
  color:#555;
  font-size:13px;
}

.category.active{
  background:#5b21b6;
  color:white;
  border-color:#5b21b6;
}

.section-title{
  padding:10px 12px;
  font-size:20px;
  font-weight:bold;
}

.product-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
  padding:0 12px;
}

.product{
  background:white;
  border-radius:15px;
  padding:10px;
  box-shadow:0 2px 8px rgba(0,0,0,.08);
  overflow:hidden;
  transition:.15s;
}

.product:active{
  transform:scale(.98);
}

.product-image{
  width:100%;
  height:145px;
  border-radius:11px;
  background:#f1efff;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  margin-bottom:9px;
}

.product-image img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.product-emoji{
  font-size:65px;
}

.product-name{
  font-size:15px;
  font-weight:bold;
  min-height:38px;
  line-height:19px;
}

.product-category{
  color:#777;
  font-size:11px;
  margin:5px 0;
}

.price-row{
  display:flex;
  align-items:center;
  gap:7px;
  margin:7px 0;
}

.price{
  font-size:18px;
  font-weight:bold;
  color:#5b21b6;
}

.mrp{
  color:#999;
  text-decoration:line-through;
  font-size:12px;
}

.stock{
  font-size:11px;
  color:#16803c;
  margin-bottom:8px;
}

.out-stock{
  color:#d00;
}

.product-buttons{
  display:flex;
  gap:6px;
}

.product-buttons button{
  flex:1;
  padding:9px 4px;
  border-radius:8px;
  font-size:12px;
  font-weight:bold;
}

.add{
  background:#eee8ff;
  color:#5b21b6;
}

.buy-now{
  background:#5b21b6;
  color:white;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

.empty{
  text-align:center;
  padding:50px 20px;
  color:#777;
}

.loading{
  text-align:center;
  padding:45px 20px;
  color:#5b21b6;
}

.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  z-index:2000;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.modal{
  background:white;
  width:100%;
  max-width:550px;
  max-height:90vh;
  overflow-y:auto;
  border-radius:22px 22px 0 0;
  padding:20px;
  animation:up .2s ease;
}

@keyframes up{
  from{transform:translateY(100%)}
  to{transform:translateY(0)}
}

.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:15px;
}

.close{
  width:35px;
  height:35px;
  border-radius:50%;
  background:#eee;
  font-size:20px;
}

.detail-image{
  width:100%;
  height:280px;
  border-radius:15px;
  background:#f3f1ff;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  margin-bottom:15px;
}

.detail-image img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.detail-emoji{
  font-size:100px;
}

.detail-name{
  font-size:24px;
  font-weight:bold;
  margin-bottom:7px;
}

.detail-description{
  color:#666;
  font-size:14px;
  line-height:21px;
  margin:12px 0;
}

.detail-price{
  color:#5b21b6;
  font-size:26px;
  font-weight:bold;
}

.detail-buttons{
  display:flex;
  gap:10px;
  margin-top:18px;
}

.detail-buttons button{
  flex:1;
  padding:14px;
  border-radius:11px;
  font-weight:bold;
}

.cart-item{
  display:flex;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.cart-item-image{
  width:65px;
  height:65px;
  border-radius:10px;
  background:#f1efff;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  flex-shrink:0;
}

.cart-item-image img{
  width:100%;
  height:100%;
  object-fit:contain;
}

.cart-info{
  flex:1;
}

.cart-name{
  font-weight:bold;
  font-size:14px;
}

.cart-price{
  color:#5b21b6;
  font-weight:bold;
  margin-top:4px;
}

.qty{
  display:flex;
  align-items:center;
  gap:10px;
  margin-top:7px;
}

.qty button{
  width:27px;
  height:27px;
  border-radius:7px;
  background:#eee8ff;
  color:#5b21b6;
  font-weight:bold;
}

.cart-total{
  padding:15px 0;
  font-size:20px;
  font-weight:bold;
  display:flex;
  justify-content:space-between;
}

.primary{
  width:100%;
  background:#5b21b6;
  color:white;
  padding:14px;
  border-radius:11px;
  font-weight:bold;
  font-size:15px;
}

.secondary{
  width:100%;
  background:#eee;
  color:#333;
  padding:12px;
  border-radius:11px;
  margin-top:8px;
}

.form-group{
  margin-bottom:12px;
}

.form-group label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:5px;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:9px;
  outline:none;
  font-size:14px;
}

textarea{
  resize:none;
  height:80px;
}

.payment-box{
  padding:12px;
  background:#f6f3ff;
  border-radius:10px;
  margin:12px 0;
}

.order-card{
  border:1px solid #eee;
  border-radius:12px;
  padding:13px;
  margin-bottom:10px;
}

.order-status{
  display:inline-block;
  background:#eee8ff;
  color:#5b21b6;
  padding:5px 9px;
  border-radius:15px;
  font-size:11px;
  margin-top:7px;
}

.bottom-nav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  height:65px;
  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:0 -2px 10px rgba(0,0,0,.12);
  z-index:1500;
}

.nav-btn{
  background:none;
  color:#666;
  font-size:11px;
  text-align:center;
}

.nav-icon{
  font-size:21px;

  margin-bottom:2px;
}

.nav-btn.active{

}

.toast{
  position:fixed;
  bottom:82px;
  left:50%;
  transform:translateX(-50%);

  color:white;
  padding:11px 17px;
  border-radius:25px;
  z-index:5000;
  font-size:13px;
  display:none;
  white-space:nowrap;
}

.user-box{
  background:#f6f3ff;
  padding:12px;
  border-radius:10px;
  margin-bottom:15px;
}

@media(min-width:700px){
  .product-grid{
    grid-template-columns:repeat(4,1fr);
  }

  .hero,

    max-width:1200px;
    margin-left:auto;
    margin-right:auto;
  }

  .product-grid{
    max-width:1200px;
    margin:auto;
  }
}
</style>
</head>

<body>

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
  "https://vngxyvgtboinxuzxchey.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_YjdwhsuPIv0XLcA5mKWuXA_Czk6GFpD";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   GLOBAL DATA
========================================= */

let products = [];

let filteredProducts = [];

let cart =
  JSON.parse(
    localStorage.getItem("riddhi_cart") || "[]"
  );

let currentCategory = "all";

let currentUser = null;


/* =========================================
   HELPERS
========================================= */

function escapeHTML(value){

  if(value === null || value === undefined){
    return "";
  }

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function money(value){

  const number =
    Number(value || 0);

  return "₹" +
    number.toLocaleString("en-IN");
}


function toast(message){

  const el =
    document.getElementById("toast");

  el.textContent = message;

  el.style.display = "block";

  clearTimeout(window.toastTimer);

  window.toastTimer =
    setTimeout(() => {

      el.style.display = "none";

    },2200);
}


function saveCart(){

  localStorage.setItem(
    "riddhi_cart",
    JSON.stringify(cart)
  );

}


/* =========================================
   LOAD PRODUCTS
========================================= */

async function loadProducts(){

  const grid =
    document.getElementById("productGrid");

  grid.innerHTML =
    '<div class="loading">Loading products...</div>';

  try{

    const {
      data,
      error
    } =
    await supabaseClient
      .from("products")
      .select("*")
      .order("id",{ascending:true});


    if(error){

      console.error(
        "Supabase product error:",
        error
      );

      grid.innerHTML = `
        <div class="empty">
          <h3>Products load nahi ho rahe</h3>
          <p style="margin-top:8px">
            Supabase products table check karein.
          </p>
        </div>
      `;

      return;
    }


    products =
      (data || []).map(product => ({

        id:product.id,

        name:
          product.name ||
          product.product_name ||
          "Product",

        price:
          Number(
            product.price ||
            product.selling_price ||
            0
          ),

        mrp:
          Number(
            product.mrp ||
            product.original_price ||
            product.price ||
            0
          ),

        category:
          product.category ||
          "Other",

        emoji:
          product.emoji ||
          "🎁",

        image:
          product.image ||
          product.image_url ||
          product.photo ||
          "",

        stock:
          product.stock === undefined ||
          product.stock === null
            ? 999
            : Number(product.stock),

        description:
          product.description ||
          "Beautiful product from Riddhi Party Shop."

      }));


    filteredProducts =
      [...products];


    displayProducts();

  }catch(error){

    console.error(error);

    grid.innerHTML = `
      <div class="empty">
        <h3>Something went wrong</h3>
        <p style="margin-top:8px">
          Page refresh karke dobara try karein.
        </p>
      </div>
    `;

  }

}


/* =========================================
   DISPLAY PRODUCTS
========================================= */

function displayProducts(){

  const grid =
    document.getElementById("productGrid");


  if(!filteredProducts.length){

    grid.innerHTML = `
      <div class="empty">
        <div style="font-size:45px">😔</div>
        <h3>No products found</h3>
        <p style="margin-top:7px">
          Search ya category change karke dekhein.
        </p>
      </div>
    `;

    return;
  }


  grid.innerHTML =
    filteredProducts.map(product => {

      const outOfStock =
        Number(product.stock) <= 0;


      const imageHTML =
        product.image

        ? `
          <img
            src="${escapeHTML(product.image)}"
            alt="${escapeHTML(product.name)}"
          >
        `

        : `
          <div class="product-emoji">
            ${escapeHTML(product.emoji)}
          </div>
        `;


      return `

        <div
          class="product"
          data-product-id="${escapeHTML(product.id)}"
        >

          <div class="product-image">
            ${imageHTML}
          </div>


          <div class="product-name">
            ${escapeHTML(product.name)}
          </div>


          <div class="product-category">
            ${escapeHTML(product.category)}
          </div>


          <div class="price-row">

            <span class="price">
              ${money(product.price)}
            </span>

            ${
              product.mrp > product.price
              ?
              `
                <span class="mrp">
                  ${money(product.mrp)}
                </span>
              `
              :
              ""
            }

          </div>


          <div
            class="stock ${
              outOfStock
                ? "out-stock"
                : ""
            }"
          >

            ${
              outOfStock
              ? "Out of Stock"
              : "✓ In Stock"
            }

          </div>


          <div class="product-buttons">

            <button
              class="add"
              data-action="add-cart"
              data-product-id="${escapeHTML(product.id)}"
              ${outOfStock ? "disabled" : ""}
            >
              🛒 Add
            </button>


            <button
              class="buy-now"
              data-action="buy-now"
              data-product-id="${escapeHTML(product.id)}"
              ${outOfStock ? "disabled" : ""}
            >
              ⚡ Buy Now
            </button>

          </div>

        </div>

      `;

    }).join("");

}


/* =========================================
   PRODUCT DETAILS
========================================= */

function openProductDetails(id){

  const product =
    products.find(
      p => String(p.id) === String(id)
    );


  if(!product){

    toast("Product nahi mila");

    return;
  }


  const old =
    document.querySelector(
      ".product-details-overlay"
    );

  if(old){
    old.remove();
  }


  const imageHTML =
    product.image

    ? `
      <img
        src="${escapeHTML(product.image)}"
        alt="${escapeHTML(product.name)}"
      >
    `

    : `
      <div class="detail-emoji">
        ${escapeHTML(product.emoji)}
      </div>
    `;


  const outOfStock =
    Number(product.stock) <= 0;


  const overlay =
    document.createElement("div");

  overlay.className =
    "overlay product-details-overlay";


  overlay.innerHTML = `

    <div class="modal">

      <div class="modal-header">

        <strong>
          Product Details
        </strong>

        <button
          class="close"
          data-action="close-modal"
        >
          ×
        </button>

      </div>


      <div class="detail-image">
        ${imageHTML}
      </div>


      <div class="detail-name">
        ${escapeHTML(product.name)}
      </div>


      <div
        style="
          color:#777;
          font-size:13px;
          margin-top:5px;
        "
      >
        ${escapeHTML(product.category)}
      </div>


      <div class="price-row">

        <span class="detail-price">
          ${money(product.price)}
        </span>

        ${
          product.mrp > product.price
          ?
          `
            <span class="mrp">
              ${money(product.mrp)}
            </span>
          `
          :
          ""
        }

      </div>


      <div class="detail-description">
        ${escapeHTML(product.description)}
      </div>


      <div
        class="stock ${
          outOfStock
            ? "out-stock"
            : ""
        }"
      >
        ${
          outOfStock
          ? "Out of Stock"
          : "✓ Available in Stock"
        }
      </div>


      <div class="detail-buttons">

        <button
          class="add"
          data-action="add-cart"
          data-product-id="${escapeHTML(product.id)}"
          ${outOfStock ? "disabled" : ""}
        >
          🛒 Add to Cart
        </button>


        <button
          class="buy-now"
          data-action="buy-now"
          data-product-id="${escapeHTML(product.id)}"
          ${outOfStock ? "disabled" : ""}
        >
          ⚡ Buy Now
        </button>

      </div>

    </div>

  `;


  document.body.appendChild(overlay);

}


/* =========================================
   ADD TO CART
========================================= */

function addToCart(id){

  const product =
    products.find(
      p => String(p.id) === String(id)
    );


  if(!product){

    toast("Product nahi mila");

    return;
  }


  if(Number(product.stock) <= 0){

    toast("Product out of stock hai");

    return;
  }


  const existing =
    cart.find(
      item =>
        String(item.id) === String(id)
    );


  if(existing){

    existing.qty += 1;

  }else{

    cart.push({

      id:product.id,

      name:product.name,

      price:product.price,

      image:product.image,

      emoji:product.emoji,

      qty:1

    });

  }


  saveCart();

  toast("🛒 Cart mein add ho gaya");

}


/* =========================================
   BUY NOW
========================================= */

function buyNow(id){

  addToCart(id);

  openCart();

}


/* =========================================
   CART
========================================= */

function getCartTotal(){

  return cart.reduce(

    (total,item) =>
      total +
      Number(item.price) *
      Number(item.qty),

    0

  );

}


function changeQty(id,change){

  const item =
    cart.find(
      p => String(p.id) === String(id)
    );


  if(!item){
    return;
  }


  item.qty += change;


  if(item.qty <= 0){

    cart =
      cart.filter(
        p =>
          String(p.id) !==
          String(id)
      );

  }


  saveCart();

  openCart();

}


function openCart(){

  const old =
    document.querySelector(
      ".cart-overlay"
    );

  if(old){
    old.remove();
  }


  const overlay =
    document.createElement("div");

  overlay.className =
    "overlay cart-overlay";


  let content = "";


  if(!cart.length){

    content = `

      <div class="empty">

        <div style="font-size:55px">
          🛒
        </div>

        <h3>
          Your cart is empty
        </h3>

        <p style="margin-top:7px">
          Products add karke yahan dekhein.
        </p>

      </div>

    `;

  }else{

    content =
      cart.map(item => {

        const image =
          item.image

          ? `
            <img
              src="${escapeHTML(item.image)}"
              alt=""
            >
          `

          : `
            <span style="font-size:35px">
              ${escapeHTML(item.emoji || "🎁")}
            </span>
          `;


        return `

          <div class="cart-item">

            <div class="cart-item-image">
              ${image}
            </div>


            <div class="cart-info">

              <div class="cart-name">
                ${escapeHTML(item.name)}
              </div>


              <div class="cart-price">
                ${money(item.price)}
              </div>


              <div class="qty">

                <button
                  data-action="qty-minus"
                  data-product-id="${escapeHTML(item.id)}"
                >
                  −
                </button>

                <strong>
                  ${item.qty}
                </strong>

                <button
                  data-action="qty-plus"
                  data-product-id="${escapeHTML(item.id)}"
                >
                  +
                </button>

              </div>

            </div>

          </div>

        `;

      }).join("");

  }


  const total =
    getCartTotal();


  overlay.innerHTML = `

    <div class="modal">

      <div class="modal-header">

        <strong>
          🛒 My Cart
        </strong>

        <button
          class="close"
          data-action="close-modal"
        >
          ×
        </button>

      </div>


      ${content}


      ${
        cart.length

        ?

        `

          <div class="cart-total">

            <span>
              Total
            </span>

            <span style="color:#5b21b6">
              ${money(total)}
            </span>

          </div>


          <button
            class="primary"
            data-action="checkout"
          >
            Proceed to Checkout
          </button>

        `

        :

        ""

      }

    </div>

  `;


  document.body.appendChild(overlay);

}

/* =========================================
   PLACE ORDER
========================================= */

async function placeOrder(){

  const name =
    document.getElementById(
      "checkoutName"
    ).value.trim();


  const mobile =
    document.getElementById(
      "checkoutMobile"
    ).value.trim();


  const address =
    document.getElementById(
      "checkoutAddress"
    ).value.trim();


  const payment =
    document.querySelector(
      'input[name="payment"]:checked'
    )?.value || "COD";


  if(!name){

    toast("Name enter karein");

    return;
  }


  if(!mobile){

    toast("Mobile number enter karein");

    return;
  }


  if(!address){

    toast("Address enter karein");

    return;
  }


  if(!cart.length){

    toast("Cart empty hai");

    return;
  }


  const orderItems =
    cart.map(item => ({

      id:item.id,

      name:item.name,

      price:item.price,

      qty:item.qty

    }));


  const orderData = {

    customer_name:name,

    mobile:mobile,

    address:address,

    payment_method:payment,

    total:getCartTotal(),

    items:orderItems,

    status:"Pending"

  };


  if(currentUser){

    orderData.user_id =
      currentUser.id;

  }


  try{

    let result =
      await supabaseClient
        .from("orders")
        .insert([orderData])
        .select();


    if(result.error){

      console.error(
        "Order error:",
        result.error
      );


      /*
        Agar user_id column ki wajah
        se error aaye to dobara bina
        user_id ke order try karenge.
      */

      delete orderData.user_id;


      result =
        await supabaseClient
          .from("orders")
          .insert([orderData])
          .select();

    }


    if(result.error){

      console.error(
        result.error
      );

      toast(
        "Order place nahi hua. Supabase Orders table check karein."
      );

      return;
    }


    cart = [];

    saveCart();


    const checkout =
      document.querySelector(
        ".checkout-overlay"
      );

    if(checkout){
      checkout.remove();
    }


    toast(
      "🎉 Order successfully place ho gaya!"
    );


    setTimeout(
      openOrders,
      700
    );


  }catch(error){

    console.error(error);

    toast(
      "Order place karte time error aaya"
    );

  }

}


/* =========================================
   LOCATION
========================================= */

function saveLocation(address,lat="",lng=""){

  localStorage.setItem(

    "riddhi_location",

    JSON.stringify({

      address:address,

      lat:lat,

      lng:lng

    })

  );


  updateLocation();

}


function updateLocation(){

  const saved =
    JSON.parse(
      localStorage.getItem(
        "riddhi_location"
      ) || "null"
    );


  const el =
    document.getElementById(
      "locationText"
    );


  if(!el){
    return;
  }


  if(saved && saved.address){

    el.textContent =
      saved.address;

  }else{

    el.textContent =
      "Add your delivery location";

  }

}


function useMyLocation(){

  if(!navigator.geolocation){

    toast(
      "Location browser support nahi karta"
    );

    return;
  }


  toast(
    "📍 Location detect ho rahi hai..."
  );


  navigator.geolocation.getCurrentPosition(

    position => {

      const lat =
        position.coords.latitude;

      const lng =
        position.coords.longitude;


      /*
        GPS coordinates save kar rahe hain.
        User baad mein manual address bhi
        enter kar sakta hai.
      */

      const address =
        `GPS Location: ${lat.toFixed(6)}, ${lng.toFixed(6)}`;


      saveLocation(
        address,
        lat,
        lng
      );


      toast(
        "📍 Location save ho gayi"
      );

    },

    error => {

      console.error(error);

      toast(
        "Location permission allow karein"
      );

    },

    {
      enableHighAccuracy:true,
      timeout:10000,
      maximumAge:0
    }

  );

}

/* =========================================
   SEND OTP
========================================= */

async function sendOTP(){

  const email =
    document.getElementById(
      "loginEmail"
    )?.value.trim();


  if(!email){

    toast("Email enter karein");

    return;
  }


  try{

    const {
      error
    } =
      await supabaseClient.auth.signInWithOtp({

        email:email,

        options:{
          emailRedirectTo:
            window.location.href
        }

      });


    if(error){

      console.error(error);

      toast(
        error.message ||
        "OTP send nahi hua"
      );

      return;
    }


    toast(
      "📩 Email check karein"
    );

  }catch(error){

    console.error(error);

    toast(
      "Login error"
    );

  }

}

async function openOrders(){

  const old =
    document.querySelector(
      ".orders-overlay"
    );

  if(old){
    old.remove();
  }


  const overlay =
    document.createElement("div");

  overlay.className =
    "overlay orders-overlay";


  overlay.innerHTML = `

    <div class="modal">

        <strong>
          📦 My Orders
        </strong>

        <button
          class="close"
          data-action="close-modal"

          ×
        </button>

      </div>


      <div
        id="ordersList"
        class="loading"
      >
        Loading orders...
      </div>

    </div>

  `;


  document.body.appendChild(overlay);


  await loadOrders();

}


async function loadOrders(){

  const list =
    document.getElementById(
      "ordersList"
    );


  if(!list){
    return;
  }


  try{

    let query =
      supabaseClient
        .from("orders")
        .select("*")
        .order(
          "created_at",
          {ascending:false}
        );


    if(currentUser){

      query =
        query.eq(
          "user_id",
          currentUser.id
        );

    }


    const {
      data,
      error
    } =
      await query;


    if(error){

      console.error(error);

      list.innerHTML = `
        <div class="empty">
          Orders load nahi ho rahe.
        </div>
      `;

      return;
    }


    if(!data || !data.length){

      list.innerHTML = `

        <div class="empty">

          <div style="font-size:50px">
            📦
          </div>

          <h3>
            No Orders Yet
          </h3>

          <p style="margin-top:7px">
            Aapke orders yahan dikhेंगे.
          </p>

        </div>

      `;

      return;
    }


    list.className = "";


    list.innerHTML =
      data.map(order => {

        const date =
          order.created_at

          ? new Date(
              order.created_at
            ).toLocaleString(
              "en-IN"
            )

          : "";


        let itemsText = "";


        if(Array.isArray(order.items)){

          itemsText =
            order.items.map(
              item =>
                `${item.name} × ${item.qty}`
            ).join(", ");

        }else{

          itemsText =
            String(
              order.items || ""
            );

        }


        return `

          <div class="order-card">

            <strong>
              Order #${escapeHTML(order.id)}
            </strong>


            <div
              style="
                margin-top:7px;
                font-size:13px;
                color:#555;
              "
            >
              ${escapeHTML(itemsText)}
            </div>


            <div
              style="
                margin-top:8px;
                font-weight:bold;
              "
            >
              Total:
              ${money(order.total)}
            </div>


            <div
              style="
                margin-top:5px;
                font-size:11px;
                color:#888;
              "
            >
              ${escapeHTML(date)}
            </div>


            <span class="order-status">
              ${escapeHTML(
                order.status || "Pending"
              )}
            </span>

          </div>

        `;

      }).join("");


  }catch(error){

    console.error(error);

    list.innerHTML = `
      <div class="empty">
        Error loading orders.
      </div>
    `;

  }

}


/* =========================================
   SEARCH
========================================= */

function applyFilters(){

  const search =
    document.getElementById(
      "searchInput"
    ).value
      .trim()
      .toLowerCase();


  filteredProducts =
    products.filter(product => {

      const categoryMatch =
        currentCategory === "all" ||
        String(
          product.category
        ).toLowerCase()
        ===
        currentCategory.toLowerCase();


      const searchMatch =
        !search ||

        String(product.name)
          .toLowerCase()
          .includes(search)

        ||

        String(product.category)
          .toLowerCase()
          .includes(search);


      return (
        categoryMatch &&
        searchMatch
      );

    });


  displayProducts();

}


/* =========================================
   EVENT DELEGATION
   IMPORTANT:
   ALL BUTTON CLICKS COME HERE
========================================= */

document.addEventListener(
  "click",
  function(event){

    const actionElement =
      event.target.closest(
        "[data-action]"
      );


    if(actionElement){

      const action =
        actionElement.dataset.action;


      const id =
        actionElement.dataset.productId;


      if(action === "add-cart"){

        event.stopPropagation();

        addToCart(id);

        return;
      }


      if(action === "buy-now"){

        event.stopPropagation();

        buyNow(id);

        return;
      }


      if(action === "qty-minus"){

        changeQty(id,-1);

        return;
      }


      if(action === "qty-plus"){

        changeQty(id,1);

        return;
      }


      if(action === "close-modal"){

        const overlay =
          actionElement.closest(
            ".overlay"
          );

        if(overlay){
          overlay.remove();
        }

        return;
      }


      if(action === "cart"){

        openCart();

        return;
      }


      if(action === "checkout"){

        const cartOverlay =
          document.querySelector(
            ".cart-overlay"
          );

        if(cartOverlay){
          cartOverlay.remove();
        }

        openCheckout();

        return;
      }


      if(action === "place-order"){

        placeOrder();

        return;
      }


      if(action === "login"){

        openLogin();

        return;
      }


      if(action === "logout"){

        logout();

        return;
      }


      if(action === "orders"){

        const loginOverlay =
          document.querySelector(
            ".login-overlay"
          );

        if(loginOverlay){
          loginOverlay.remove();
        }

        openOrders();

        return;
      }


      if(action === "send-otp"){

        sendOTP();

        return;
      }


      if(action === "use-location"){

        useMyLocation();

        return;
      }


      if(action === "manual-location"){

        manualLocation();

        return;
      }


      if(action === "save-manual-location"){

        const address =
          document.getElementById(
            "manualAddress"
          )?.value.trim();


        if(!address){

          toast(
            "Address enter karein"
          );

          return;
        }


        saveLocation(
          address
        );


        const overlay =
          actionElement.closest(
            ".overlay"
          );

        if(overlay){
          overlay.remove();
        }


        toast(
          "📍 Address save ho gaya"
        );

        return;
      }


      if(action === "category"){

        currentCategory =
          actionElement.dataset.category ||
          "all";


        document
          .querySelectorAll(
            ".category"
          )
          .forEach(button => {

            button.classList.remove(
              "active"
            );

          });


        actionElement.classList.add(
          "active"
        );


        applyFilters();

        return;
      }


      if(action === "home"){

        window.scrollTo({

          top:0,

          behavior:"smooth"

        });

        return;
      }

    }


    /*
      BUTTON nahi tha.

      Ab check karte hain ki user ne
      product card par click kiya hai ya nahi.
    */

    const productCard =
      event.target.closest(
        ".product[data-product-id]"
      );


    if(productCard){

      const id =
        productCard.dataset.productId;


      openProductDetails(id);

    }

  }
);
