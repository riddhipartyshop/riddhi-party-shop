<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Riddhi Party Shop</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f7f7f8;
  color:#222;
  padding-bottom:75px;
}

button{
  font:inherit;
  cursor:pointer;
}

header{
  background:#fff;
  position:sticky;
  top:0;
  z-index:20;
  box-shadow:0 2px 10px #0001;
}

.top{
  padding:14px 16px 10px;
}

.logo{
  font-size:22px;
  font-weight:800;
  color:#7c3aed;
}

.location{
  font-size:12px;
  color:#777;
  margin-top:3px;
}

.search{
  margin-top:10px;
  display:flex;
  align-items:center;
  background:#f1f1f3;
  border-radius:12px;
  padding:0 12px;
}

.search input{
  width:100%;
  border:0;
  outline:0;
  background:transparent;
  padding:13px 8px;
  font-size:15px;
}

.hero{
  margin:14px 16px;
  padding:20px;
  border-radius:18px;
  background:linear-gradient(135deg,#7c3aed,#9333ea);
  color:#fff;
}

.hero h1{
  margin:0 0 7px;
  font-size:25px;
}

.hero p{
  margin:0 0 14px;
  font-size:14px;
}

.hero button{
  border:0;
  background:#fff;
  color:#7c3aed;
  padding:10px 16px;
  border-radius:10px;
  font-weight:700;
}

.section{
  padding:8px 16px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:10px;
}

.section-head h2{
  font-size:18px;
  margin:0;
}

.categories{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-bottom:5px;
}

.cat{
  min-width:92px;
  background:#fff;
  border:1px solid #eee;
  border-radius:14px;
  padding:12px 8px;
  text-align:center;
}

.cat-icon{
  width:52px;
  height:52px;
  margin:auto;
  border-radius:14px;
  background:#f1eaff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
}

.cat span{
  display:block;
  font-size:12px;
  font-weight:700;
  margin-top:7px;
}

.products{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.card{
  background:#fff;
  border-radius:15px;
  overflow:hidden;
  box-shadow:0 2px 8px #0000000c;
}

.pic{
  height:170px;
  background:#f4f4f5;
  display:flex;
  align-items:center;
  justify-content:center;
}

.pic img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.noimg{
  font-size:48px;
}

.info{
  padding:10px;
}

.name{
  font-size:14px;
  font-weight:700;
  min-height:35px;
}

.price{
  margin-top:6px;
  font-weight:800;
  font-size:17px;
}

.mrp{
  color:#999;
  text-decoration:line-through;
  font-size:12px;
  margin-left:5px;
}

.add{
  width:100%;
  margin-top:9px;
  border:1px solid #7c3aed;
  color:#7c3aed;
  background:#fff;
  border-radius:9px;
  padding:8px;
  font-weight:800;
}

.qty{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:9px;
  background:#7c3aed;
  color:#fff;
  border-radius:9px;
  overflow:hidden;
}

.qty button{
  width:35px;
  height:34px;
  border:0;
  background:#7c3aed;
  color:#fff;
  font-size:20px;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:35px 15px;
  color:#777;
  background:#fff;
  border-radius:15px;
}

.loading{
  grid-column:1/-1;
  text-align:center;
  padding:40px;
  color:#777;
  background:#fff;
  border-radius:15px;
}

.page{
  display:none;
  padding:15px 16px 85px;
}

.page.active{
  display:block;
}

.back{
  border:0;
  background:none;
  color:#7c3aed;
  font-weight:700;
  padding:0 0 14px;
}

.cat-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.cat-big{
  background:#fff;
  border:0;
  border-radius:17px;
  padding:20px 10px;
  text-align:center;
  box-shadow:0 2px 8px #0001;
}

.cat-big div{
  font-size:42px;
}

.cat-big strong{
  display:block;
  margin-top:8px;
}

.cart-box{
  background:#fff;
  border-radius:15px;
  padding:14px;
  margin-bottom:12px;
}

.cart-row{
  display:flex;
  gap:10px;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid #eee;
}

.cart-img{
  width:58px;
  height:58px;
  border-radius:10px;
  object-fit:cover;
  background:#f3f3f3;
}

.cart-name{
  flex:1;
  font-weight:700;
  font-size:13px;
}

.smallqty{
  display:flex;
  align-items:center;
  gap:8px;
}

.smallqty button{
  border:0;
  background:#eee;
  border-radius:7px;
  width:28px;
  height:28px;
}

.total{
  font-size:20px;
  font-weight:800;
  text-align:right;
  margin-top:12px;
}

.checkout input,
.checkout textarea,
.checkout select{
  width:100%;
  border:1px solid #ddd;
  border-radius:10px;
  padding:12px;
  margin-bottom:10px;
  outline:none;
  font-size:14px;
}

.checkout textarea{
  height:80px;
  resize:none;
}

.primary{
  width:100%;
  border:0;
  background:#7c3aed;
  color:#fff;
  border-radius:11px;
  padding:13px;
  font-weight:800;
}

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:#fff;
  display:flex;
  justify-content:space-around;
  align-items:center;
  border-top:1px solid #ddd;
  z-index:30;
}

.nav{
  border:0;
  background:none;
  color:#777;
  font-size:11px;
}

.nav b{
  display:block;
  font-size:22px;
  line-height:22px;
}

.nav.active{
  color:#7c3aed;
}

.badge{
  position:absolute;
  margin-left:-7px;
  margin-top:-3px;
  background:#ef4444;
  color:#fff;
  border-radius:20px;
  font-size:10px;
  padding:2px 5px;
}

@media(min-width:700px){
  .products{
    grid-template-columns:repeat(4,1fr);
  }

  .cat-grid{
    grid-template-columns:repeat(4,1fr);
  }

  main,
  .page{
    max-width:1100px;
    margin:auto;
  }
}
</style>
</head>

<body>

<header>
  <div class="top">

    <div class="logo">🪷 Riddhi Party Shop</div>

    <div class="location">
      📍 4B Shukla Market, Panki Road, Kalyanpur
    </div>

    <div class="search">
      🔍
      <input
        id="searchInput"
        placeholder="Search balloons, gifts, toys..."
        oninput="renderProducts()"
      >
    </div>

  </div>
</header>


<!-- HOME -->

<main id="homePage">

  <section class="hero">
    <h1>Great Prices 🎉</h1>
    <p>
      Birthday, Gifts & Party Decoration — sab ek jagah!
    </p>

    <button onclick="openCategories()">
      Shop Now
    </button>
  </section>


  <section class="section">

    <div class="section-head">
      <h2>Shop by Category</h2>
    </div>

    <div class="categories">

      <button class="cat" onclick="selectCategory('Decoration')">
        <div class="cat-icon">🎈</div>
        <span>Decoration</span>
      </button>

      <button class="cat" onclick="selectCategory('Gifts')">
        <div class="cat-icon">🎁</div>
        <span>Gifts</span>
      </button>

      <button class="cat" onclick="selectCategory('Toys')">
        <div class="cat-icon">🧸</div>
        <span>Toys</span>
      </button>

      <button class="cat" onclick="selectCategory('Party Supplies')">
        <div class="cat-icon">🥳</div>
        <span>Party</span>
      </button>

    </div>

  </section>


  <section class="section">

    <div class="section-head">
      <h2 id="productTitle">All Products</h2>
    </div>

    <div id="products" class="products">

      <div class="loading">
        Products load ho rahe hain...
      </div>

    </div>

  </section>

</main>


<!-- CATEGORY -->

<section id="categoryPage" class="page">

  <button class="back" onclick="goHome()">
    ← Home
  </button>

  <h2>Shop by Category</h2>

  <div class="cat-grid">

    <button class="cat-big" onclick="selectCategory('Decoration')">
      <div>🎈</div>
      <strong>Birthday Decoration</strong>
    </button>

    <button class="cat-big" onclick="selectCategory('Gifts')">
      <div>🎁</div>
      <strong>Gifts</strong>
    </button>

    <button class="cat-big" onclick="selectCategory('Toys')">
      <div>🧸</div>
      <strong>Toys</strong>
    </button>

    <button class="cat-big" onclick="selectCategory('Party Supplies')">
      <div>🥳</div>
      <strong>Party Supplies</strong>
    </button>

  </div>

</section>


<!-- CART -->

<section id="cartPage" class="page">

  <button class="back" onclick="goHome()">
    ← Continue Shopping
  </button>

  <h2>Your Cart 🛒</h2>

  <div id="cartItems"></div>

  <div class="cart-box checkout">

    <div class="total" id="cartTotal">
      Total ₹0
    </div>

    <h3>Delivery Details</h3>

    <input
      id="customerName"
      placeholder="Your Name"
    >

    <input
      id="customerMobile"
      placeholder="Mobile Number"
      type="tel"
    >

    <textarea
      id="customerAddress"
      placeholder="Full Delivery Address"
    ></textarea>

    <select id="paymentMethod">
      <option value="COD">
        Cash on Delivery
      </option>

      <option value="PICKUP">
        Pay at Shop / Pickup
      </option>

      <option value="UPI">
        UPI
      </option>
    </select>

    <button
      class="primary"
      onclick="placeOrder()"
    >
      Place Order
    </button>

  </div>

</section>


<!-- ORDERS -->

<section id="ordersPage" class="page">

  <button class="back" onclick="goHome()">
    ← Home
  </button>

  <h2>My Orders 📦</h2>

  <div id="ordersList"></div>

</section>


<!-- NAVIGATION -->

<nav class="bottom">

  <button class="nav active" onclick="goHome()">
    <b>⌂</b>
    Home
  </button>

  <button class="nav" onclick="openCategories()">
    <b>☷</b>
    Categories
  </button>

  <button class="nav" onclick="openCart()">
    <b>🛒<span id="cartBadge" class="badge">0</span></b>
    Cart
  </button>

  <button class="nav" onclick="openOrders()">
    <b>📦</b>
    Orders
  </button>

</nav>


<script>

/* =====================================================
   SUPABASE
   ===================================================== */

const SUPABASE_URL =
  "https://vngxyvgtboinxuzxchey.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_YjdwhsuPIv0XLcA5mKWuXA_Czk6GFpD";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =====================================================
   APP DATA
   ===================================================== */

let products = [];

let currentCategory = "";

let cart =
  JSON.parse(
    localStorage.getItem("rps_cart") || "[]"
  );


/* =====================================================
   LOAD PRODUCTS
   ===================================================== */

async function loadProducts(){

  const box =
    document.getElementById("products");

  box.innerHTML =
    '<div class="loading">Products load ho rahe hain...</div>';

  try{

    const result =
      await supabaseClient
        .from("products")
        .select("*")
        .order("created_at", {
          ascending:false
        });

    if(result.error){

      console.error(
        "Supabase error:",
        result.error
      );

      box.innerHTML = `
        <div class="empty">
          <h3>Products load nahi hue</h3>
          <p>${result.error.message}</p>
        </div>
      `;

      return;
    }


    products =
      result.data || [];


    /*
      Agar active column available hai
      aur product active=false hai,
      to usse hide karenge.
    */

    products =
      products.filter(function(p){

        if(
          Object.prototype.hasOwnProperty.call(
            p,
            "active"
          )
        ){
          return p.active !== false;
        }

        return true;

      });


    renderProducts();

    updateCartBadge();


  }catch(error){

    console.error(error);

    box.innerHTML = `
      <div class="empty">
        <h3>Website database error</h3>
        <p>Database se connection nahi ho pa raha.</p>
      </div>
    `;

  }

}


/* =====================================================
   RENDER PRODUCTS
   ===================================================== */

function renderProducts(){

  const box =
    document.getElementById("products");

  const search =
    (
      document.getElementById("searchInput")
        ?.value || ""
    ).toLowerCase();


  let list =
    products.filter(function(p){

      const text =
        (
          (p.name || "") +
          " " +
          (p.category || "") +
          " " +
          (p.description || "")
        ).toLowerCase();


      const categoryOK =
        !currentCategory ||
        (p.category || "").toLowerCase()
        === currentCategory.toLowerCase();


      const searchOK =
        !search ||
        text.includes(search);


      return categoryOK && searchOK;

    });


  document.getElementById(
    "productTitle"
  ).textContent =
    currentCategory || "All Products";


  if(!list.length){

    box.innerHTML = `
      <div class="empty">
        <h3>Product nahi mila 😔</h3>
        <p>Abhi products available nahi hain.</p>
      </div>
    `;

    return;

  }


  box.innerHTML =
    list.map(productCard).join("");

}


/* =====================================================
   PRODUCT CARD
   ===================================================== */

function productCard(p){

  const id =
    p.id;

  const name =
    p.name || "Product";


  const price =
    Number(p.price || 0);


  const mrp =
    Number(p.mrp || 0);


  const image =
    p.image_url ||
    p.image ||
    p.photo ||
    "";


  const existing =
    cart.find(function(item){
      return String(item.id) === String(id);
    });


  const qty =
    existing ? existing.qty : 0;


  return `

    <div class="card">

      <div class="pic">

        ${
          image
          ?
          `<img
            src="${escapeHtml(image)}"
            alt="${escapeHtml(name)}"
            onerror="this.style.display='none';this.parentElement.innerHTML='<div class=noimg>🎁</div>'"
          >`
          :
          `<div class="noimg">🎁</div>`
        }

      </div>


      <div class="info">

        <div class="name">
          ${escapeHtml(name)}
        </div>


        <div class="price">

          ₹${price}

          ${
            mrp > price
            ?
            `<span class="mrp">
              ₹${mrp}
            </span>`
            :
            ""
          }

        </div>


        ${
          qty === 0

          ?

          `<button
            class="add"
            onclick="addToCart('${escapeJs(id)}')"
          >
            Add to Cart
          </button>`

          :

          `<div class="qty">

            <button
              onclick="changeQty('${escapeJs(id)}',-1)"
            >
              −
            </button>

            <span>${qty}</span>

            <button
              onclick="changeQty('${escapeJs(id)}',1)"
            >
              +
            </button>

          </div>`
        }

      </div>

    </div>

  `;

}


/* =====================================================
   CART
   ===================================================== */

function addToCart(id){

  const product =
    products.find(function(p){
      return String(p.id) === String(id);
    });


  if(!product){
    return;
  }


  const existing =
    cart.find(function(item){
      return String(item.id) === String(id);
    });


  if(existing){

    existing.qty++;

  }else{

    cart.push({
      id:product.id,
      name:product.name,
      price:Number(product.price || 0),
      image:product.image_url || product.image || "",
      qty:1
    });

  }


  saveCart();

  renderProducts();

}


function changeQty(id, amount){

  const item =
    cart.find(function(item){
      return String(item.id) === String(id);
    });


  if(!item){
    return;
  }


  item.qty += amount;


  if(item.qty <= 0){

    cart =
      cart.filter(function(x){
        return String(x.id) !== String(id);
      });

  }


  saveCart();

  renderProducts();

  if(
    document.getElementById("cartPage")
      .classList.contains("active")
  ){

    renderCart();

  }

}


function saveCart(){

  localStorage.setItem(
    "rps_cart",
    JSON.stringify(cart)
  );

  updateCartBadge();

}


function updateCartBadge(){

  const total =
    cart.reduce(
      function(sum,item){
        return sum + item.qty;
      },
      0
    );


  document.getElementById(
    "cartBadge"
  ).textContent = total;

}


/* =====================================================
   CART PAGE
   ===================================================== */

function renderCart(){

  const box =
    document.getElementById("cartItems");


  if(!cart.length){

    box.innerHTML = `
      <div class="cart-box">
        <div class="empty">
          <h3>Cart empty hai 🛒</h3>
          <p>Products add kijiye.</p>
        </div>
      </div>
    `;

    document.getElementById(
      "cartTotal"
    ).textContent =
      "Total ₹0";

    return;

  }


  box.innerHTML =
    cart.map(function(item){

      return `

        <div class="cart-box">

          <div class="cart-row">

            ${
              item.image
              ?
              `<img
                class="cart-img"
                src="${escapeHtml(item.image)}"
              >`
              :
              `<div class="cart-img"
                style="display:flex;align-items:center;justify-content:center;font-size:28px">
                🎁
              </div>`
            }


            <div class="cart-name">
              ${escapeHtml(item.name)}
              <br>
              ₹${item.price}
            </div>


            <div class="smallqty">

              <button
                onclick="changeQty('${escapeJs(item.id)}',-1)"
              >
                −
              </button>

              <b>${item.qty}</b>

              <button
                onclick="changeQty('${escapeJs(item.id)}',1)"
              >
                +
              </button>

            </div>

          </div>

        </div>

      `;

    }).join("");


  const total =
    cart.reduce(
      function(sum,item){
        return sum +
          Number(item.price || 0) *
          item.qty;
      },
      0
    );


  document.getElementById(
    "cartTotal"
  ).textContent =
    "Total ₹" + total;

}


/* =====================================================
   ORDER
   ===================================================== */

async function placeOrder(){

  if(!cart.length){

    alert("Cart empty hai.");

    return;

  }


  const name =
    document.getElementById(
      "customerName"
    ).value.trim();


  const mobile =
    document.getElementById(
      "customerMobile"
    ).value.trim();


  const address =
    document.getElementById(
      "customerAddress"
    ).value.trim();


  const payment =
    document.getElementById(
      "paymentMethod"
    ).value;


  if(!name || !mobile){

    alert(
      "Name aur mobile number bhariye."
    );

    return;

  }


  const total =
    cart.reduce(
      function(sum,item){
        return sum +
          Number(item.price || 0) *
          item.qty;
      },
      0
    );


  const orderData = {

    customer_name:name,

    mobile:mobile,

    address:address,

    payment_method:payment,

    items:cart,

    total:total,

    status:"New"

  };


  try{

    const result =
      await supabaseClient
        .from("orders")
        .insert([orderData]);


    if(result.error){

      console.error(result.error);

      alert(
        "Order save nahi hua: " +
        result.error.message
      );

      return;

    }


    alert(
      "Order successfully place ho gaya 🎉"
    );


    cart = [];

    saveCart();

    renderCart();

    goHome();


  }catch(error){

    console.error(error);

    alert(
      "Order place karte waqt error aa gaya."
    );

  }

}


/* =====================================================
   NAVIGATION
   ===================================================== */

function hidePages(){

  document.getElementById(
    "homePage"
  ).style.display = "none";


  document.querySelectorAll(
    ".page"
  ).forEach(function(page){

    page.classList.remove("active");

  });

}


function goHome(){

  hidePages();

  document.getElementById(
    "homePage"
  ).style.display = "block";

  currentCategory = "";

  renderProducts();

}


function openCategories(){

  hidePages();

  document.getElementById(
    "categoryPage"
  ).classList.add("active");

}


function openCart(){

  hidePages();

  document.getElementById(
    "cartPage"
  ).classList.add("active");

  renderCart();

}


function openOrders(){

  hidePages();

  document.getElementById(
    "ordersPage"
  ).classList.add("active");

  loadOrders();

}


function selectCategory(category){

  currentCategory =
    category;

  hidePages();

  document.getElementById(
    "homePage"
  ).style.display = "block";

  renderProducts();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =====================================================
   ORDERS
   ===================================================== */

async function loadOrders(){

  const box =
    document.getElementById(
      "ordersList"
    );


  box.innerHTML =
    '<div class="loading">Orders load ho rahe hain...</div>';


  try{

    const result =
      await supabaseClient
        .from("orders")
        .select("*")
        .order("created_at", {
          ascending:false
        });


    if(result.error){

      box.innerHTML = `
        <div class="cart-box">
          Orders load nahi hue.
        </div>
      `;

      return;

    }


    const orders =
      result.data || [];


    if(!orders.length){

      box.innerHTML = `
        <div class="cart-box">
          <div class="empty">
            Abhi koi order nahi hai.
          </div>
        </div>
      `;

      return;

    }


    box.innerHTML =
      orders.map(function(order){

        return `

          <div class="cart-box">

            <b>
              Order #${order.id || ""}
            </b>

            <p>
              ₹${order.total || 0}
            </p>

            <p>
              ${escapeHtml(
                order.customer_name || ""
              )}
            </p>

            <span>
              ${escapeHtml(
                order.status || "New"
              )}
            </span>

          </div>

        `;

      }).join("");


  }catch(error){

    console.error(error);

    box.innerHTML =
      '<div class="cart-box">Orders load nahi hue.</div>';

  }

}


/* =====================================================
   SECURITY HELPERS
   ===================================================== */

function escapeHtml(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function escapeJs(value){

  return String(value ?? "")
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");

}


/* =====================================================
   START WEBSITE
   ===================================================== */

updateCartBadge();

loadProducts();

</script>
