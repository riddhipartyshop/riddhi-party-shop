<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00a82d">
<meta name="description" content="Riddhi Party Shop - Gifts, Toys and Birthday Decorations">
<link rel="manifest" href="manifest.json">
<title>Riddhi Party Shop</title>

<style>
:root{
 :root{
  --green:#7c3aed;
  --dark:#5b21b6;
 --bg:#f6f7f7;
 --card:#fff;
 --text:#171717;
 --muted:#777;
 --line:#e7e7e7;
}

*{box-sizing:border-box}

body{
 margin:0;
 background:var(--bg);
 font-family:Arial,Helvetica,sans-serif;
 color:var(--text);
 padding-bottom:78px;
}

button,input,textarea{font:inherit}
button{cursor:pointer;border:0}

.top{
 position:sticky;
 top:0;
 z-index:20;
 background:#fff;
 padding:12px 14px 10px;
 border-bottom:1px solid var(--line);
}

.wrap{
 max-width:900px;
 margin:auto;
 padding:0 12px;
}

.logo{
 font-size:20px;
 font-weight:800;
 color:var(--green);
}

.sub{
 font-size:12px;
 color:var(--muted);
 margin-top:2px;
}

.search{
 margin-top:10px;
 display:flex;
 align-items:center;
 background:#f1f3f2;
 border-radius:12px;
 padding:0 12px;
}

.search input{
 width:100%;
 border:0;
 background:transparent;
 padding:12px 9px;
 outline:0;
}

.hero{
 margin:12px 0;
 background:linear-gradient(135deg,#7c3aed,#a855f7);
 color:#fff;
 border-radius:16px;
 padding:18px;
 position:relative;
 overflow:hidden;
}

.hero:after{
 content:"🎈";
 position:absolute;
 right:18px;
 bottom:-15px;
 font-size:70px;
 opacity:.22;
 pointer-events:none;
 z-index:0;
}

.hero h1,
.hero p,
.hero button{
 position:relative;
 z-index:1;
}

.hero h1{
 margin:0 0 6px;
 font-size:25px;
}

.hero p{
 margin:0 0 13px;
 font-size:14px;
 max-width:72%;
}

.heroBtn{
 background:#fff;
 color:var(--green);
 font-weight:800;
 border-radius:10px;
 padding:10px 14px;
}

.sectionHead{
 display:flex;
 align-items:center;
 justify-content:space-between;
 margin:18px 2px 10px;
}

.sectionHead h2{
 font-size:18px;
 margin:0;
}

.see{
 background:none;
 color:var(--green);
 font-weight:700;
 padding:5px;
}

.cats{
 display:flex;
 gap:9px;
 overflow:auto;
 padding-bottom:3px;
 scrollbar-width:none;
}

.cats::-webkit-scrollbar{display:none}

.cat{
 background:#fff;
 border:1px solid var(--line);
 border-radius:12px;
 padding:10px 13px;
 white-space:nowrap;
}

.cat.active{
  background:#f3e8ff;
  border-color:#c084fc;
  color:#5b21b6;
  font-weight:800;
}

.chips{
 display:flex;
 gap:8px;
 overflow:auto;
 margin:12px 0 3px;
 scrollbar-width:none;
}

.chips::-webkit-scrollbar{display:none}

.chip{
 background:#fff;
 border:1px solid var(--line);
 border-radius:20px;
 padding:8px 12px;
 white-space:nowrap;
 font-size:13px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(2,minmax(0,1fr));
 gap:10px;
}

.product{
 background:var(--card);
 border-radius:14px;
 overflow:hidden;
 border:1px solid var(--line);
 box-shadow:0 2px 8px #00000008;
}

.pic{
 height:145px;
 background:#f0f2f1;
 display:flex;
 align-items:center;
 justify-content:center;
 font-size:54px;
}

.info{padding:10px}

.name{
 font-weight:700;
 font-size:14px;
 min-height:34px;
}

.price{
 font-weight:800;
 font-size:17px;
 margin-top:5px;
}

.old{
 text-decoration:line-through;
 color:#999;
 font-size:12px;
 margin-left:5px;
 font-weight:400;
}

.add{
 width:100%;
 margin-top:8px;
 background:var(--green);
 color:#fff;
 border-radius:9px;
 padding:9px;
 font-weight:800;
}

.empty{
 background:#fff;
 border:1px dashed #bbb;
 border-radius:12px;
 padding:22px;
 text-align:center;
 color:var(--muted);
 grid-column:1/-1;
}

.bottom{
 position:fixed;
 left:0;
 right:0;
 bottom:0;
 background:#fff;
 border-top:1px solid var(--line);
 display:flex;
 justify-content:space-around;
 padding:8px 5px calc(8px + env(safe-area-inset-bottom));
 z-index:30;
}

.nav{
 background:none;
 color:#666;
 font-size:12px;
 text-align:center;
}

.nav b{
 display:block;
 font-size:21px;
 line-height:23px;
}

.nav.active{
 color:var(--green);
 font-weight:800;
}

.cartbar{
 position:fixed;
 left:12px;
 right:12px;
 bottom:72px;
 background:#111;
 color:#fff;
 border-radius:13px;
 padding:12px 14px;
 display:none;
 align-items:center;
 justify-content:space-between;
 z-index:25;
 box-shadow:0 5px 20px #0003;
}

.cartbar.show{display:flex}

.checkout{
 background:var(--green);
 padding:9px 13px;
 border-radius:9px;
 font-weight:800;
 color:#fff;
}

.modalBg{
 position:fixed;
 inset:0;
 background:#0007;
 display:none;
 align-items:flex-end;
 z-index:50;
}

.modalBg.open{display:flex}

.modal{
 background:#fff;
 width:100%;
 max-height:88vh;
 overflow:auto;
 border-radius:20px 20px 0 0;
 padding:18px;
}

.modalTop{
 display:flex;
 justify-content:space-between;
 align-items:center;
}

.modalTop h3{
 margin:0;
 font-size:20px;
}

.close{
 background:#eee;
 border-radius:50%;
 width:34px;
 height:34px;
}

.row{
 border-bottom:1px solid var(--line);
 padding:12px 0;
}

.pay{
 display:block;
 border:1px solid var(--line);
 border-radius:11px;
 padding:11px;
 margin:8px 0;
}

.pay input{margin-right:8px}

.form{
 width:100%;
 border:1px solid #ddd;
 border-radius:10px;
 padding:11px;
 margin:7px 0;
}

.primary{
 width:100%;
 background:var(--green);
 color:#fff;
 padding:12px;
 border-radius:10px;
 font-weight:800;
 margin-top:8px;
}

.orderCard{
 border:1px solid var(--line);
 border-radius:12px;
 padding:12px;
 margin:9px 0;
}

.small{
 font-size:12px;
 color:var(--muted);
}

@media(min-width:650px){
 .grid{grid-template-columns:repeat(4,1fr)}
 .pic{height:165px}
 .modalBg{
  align-items:center;
  padding:20px;
 }
 .modal{
  max-width:520px;
  border-radius:18px;
 }
}
</style>
</head>

<body>

<header class="top">
<div class="wrap">

<div class="logo">Riddhi Party Shop</div>
<div class="sub">Gifts • Toys • Birthday Decoration • Balloons</div>

<div class="search">
<span>🔎</span>
<input
 id="search"
 placeholder="Search balloons, toys, gifts..."
 oninput="render()">
</div>

</div>
</header>


<main class="wrap">

<section class="hero">

<h1>Birthday Shopping Made Easy 🎉</h1>

<p>
Gifts, toys & decorations at great prices.
Fast local delivery available.
</p>

<button class="heroBtn" onclick="showOffers()">
🔥 Great Prices
</button>

</section>


<div class="sectionHead">
<h2>Shop by category</h2>
<button class="see" onclick="showAll()">View All</button>
</div>


<div class="cats">

<button class="cat active"
data-cat=""
onclick="setCat('')">
All
</button>

<button class="cat"
data-cat="Combos"
onclick="setCat('Combos')">
🎁 Combos
</button>

<button class="cat"
data-cat="Gifts"
onclick="setCat('Gifts')">
🎁 Gifts
</button>

<button class="cat"
data-cat="Toys"
onclick="setCat('Toys')">
🧸 Toys
</button>

<button class="cat"
data-cat="Decoration"
onclick="setCat('Decoration')">
🎈 Decoration
</button>

<button class="cat"
data-cat="Party Supplies"
onclick="setCat('Party Supplies')">
🥳 Party
</button>

</div>


<div class="chips">

<button class="chip"
onclick="quickSearch('balloon')">
🎈 Balloons
</button>

<button class="chip"
onclick="quickSearch('birthday')">
🎂 Birthday
</button>

<button class="chip"
onclick="quickSearch('gift')">
🎁 Gifts
</button>

<button class="chip"
onclick="quickSearch('toy')">
🧸 Toys
</button>

</div>


<div class="sectionHead">
<h2 id="productsTitle">Popular products</h2>
<span class="small" id="count"></span>
</div>


<section class="grid" id="products"></section>

</main>


<div class="cartbar" id="cartbar">

<span id="cartText">
0 items • ₹0
</span>

<button class="checkout"
onclick="openCheckout()">
View Cart
</button>

</div>


<nav class="bottom">

<button class="nav active"
onclick="goHome()">
<b>⌂</b>
Home
</button>

<button class="nav"
onclick="showAll()">
<b>▦</b>
Categories
</button>

<button class="nav"
onclick="openCheckout()">
<b>🛒</b>
Cart
</button>

<button class="nav"
onclick="showOrders()">
<b>📦</b>
Orders
</button>

</nav>


<div class="modalBg"
id="modalBg"
onclick="closeModal(event)">

<div class="modal" id="modal"></div>

</div>


<script>

const products=[

{
n:'Birthday Balloon Combo',
p:299,
o:399,
cat:'Combos',
e:'🎈',
keys:'balloon balloons birthday combo decoration'
},

{
n:'Premium Gift Hamper',
p:599,
o:799,
cat:'Gifts',
e:'🎁',
keys:'gift hamper gifts birthday present'
},

{
n:'Cute Teddy Bear (25 cm)',
p:399,
o:499,
cat:'Toys',
e:'🧸',
keys:'toy teddy toys gift'
},

{
n:'Birthday Decoration Combo',
p:999,
o:1209,
cat:'Decoration',
e:'🎉',
keys:'birthday decoration combo party'
},

{
n:'Happy Birthday Foil Balloon',
p:99,
o:129,
cat:'Party Supplies',
e:'🎈',
keys:'balloon balloons foil birthday'
},

{
n:'Metallic Balloons (10 pcs)',
p:149,
o:199,
cat:'Party Supplies',
e:'🎈',
keys:'balloon balloons metallic party'
},

{
n:'Birthday Banner',
p:99,
o:129,
cat:'Party Supplies',
e:'🎊',
keys:'birthday banner party decoration'
},

{
n:'Happy Birthday Cake Topper',
p:79,
o:99,
cat:'Party Supplies',
e:'🎂',
keys:'cake topper birthday party'
},

{
n:'Number Foil Balloon',
p:99,
o:129,
cat:'Party Supplies',
e:'🎈',
keys:'number balloon foil balloons birthday'
},

{
n:'LED Fairy Light (10 Meter)',
p:199,
o:249,
cat:'Decoration',
e:'💡',
keys:'light led decoration party'
}

];


let cat='';
let cart=[];


function render(){

const q=document
.getElementById('search')
.value
.trim()
.toLowerCase();


const list=products.filter(x=>{

const text=
(x.n+' '+x.cat+' '+x.keys)
.toLowerCase();

return
(!cat || x.cat===cat)
&&
(!q || text.includes(q));

});


document.getElementById('products').innerHTML=

list.length ?

list.map(x=>`

<article class="product">

<div class="pic">
${x.e}
</div>

<div class="info">

<div class="name">
${x.n}
</div>

<div class="price">
₹${x.p}
<span class="old">
₹${x.o}
</span>
</div>

<button class="add"
onclick="addToCart(${products.indexOf(x)})">
ADD
</button>

</div>

</article>

`).join('')

:

`
<div class="empty">

No products found.

<br>

<button
class="see"
onclick="showAll()">
Show all products
</button>

</div>
`;


document.getElementById('count').textContent=
list.length+' items';


document.getElementById('productsTitle').textContent=
q
?'Search results'
:(cat?cat:'Popular products');


document.querySelectorAll('.cat')
.forEach(b=>
b.classList.toggle(
'active',
b.dataset.cat===cat
)
);


updateCart();

}


function setCat(c){

cat=c;

document.getElementById('search').value='';

render();

document.getElementById('products')
.scrollIntoView({
behavior:'smooth',
block:'start'
});

}


function showAll(){

cat='';

document.getElementById('search').value='';

render();

document.getElementById('products')
.scrollIntoView({
behavior:'smooth',
block:'start'
});

}


function quickSearch(q){

cat='';

document.getElementById('search').value=q;

render();

document.getElementById('products')
.scrollIntoView({
behavior:'smooth',
block:'start'
});

}


function goHome(){

cat='';

document.getElementById('search').value='';

render();

window.scrollTo({
top:0,
behavior:'smooth'
});

}


function addToCart(i){

cart.push(products[i]);

updateCart();

}


function updateCart(){

let total=
cart.reduce((s,x)=>s+x.p,0);

document.getElementById('cartText')
.textContent=
`${cart.length} item${cart.length===1?'':'s'} • ₹${total}`;

document.getElementById('cartbar')
.classList.toggle(
'show',
cart.length>0
);

}


function showOffers(){

document.getElementById('modal').innerHTML=

`
<div class="modalTop">

<h3>🔥 Great Prices</h3>

<button class="close"
onclick="hideModal()">
×
</button>

</div>

<p>Today's highlighted deals:</p>

${products.slice(0,5).map(x=>`

<div class="row">

<b>${x.n}</b>

<br>

<span class="small">
₹${x.p}
<s>₹${x.o}</s>
</span>

</div>

`).join('')}

`;

document.getElementById('modalBg')
.classList.add('open');

}


function openCheckout(){

if(!cart.length){

alert(
'Cart is empty. Please add a product first.'
);

return;

}


const total=
cart.reduce((s,x)=>s+x.p,0);


document.getElementById('modal').innerHTML=

`
<div class="modalTop">

<h3>Your Cart</h3>

<button class="close"
onclick="hideModal()">
×
</button>

</div>

${cart.map((x,i)=>`

<div class="row">

<b>${x.n}</b>
— ₹${x.p}

<button
style="float:right"
onclick="removeItem(${i})">
Remove
</button>

</div>

`).join('')}


<h3>Total: ₹${total}</h3>


<input
class="form"
id="custName"
placeholder="Your name">


<input
class="form"
id="custPhone"
placeholder="Mobile number"
inputmode="tel">


<textarea
class="form"
id="custAddress"
placeholder="Delivery address"
rows="3"></textarea>


<h3>Payment option</h3>


<label class="pay">

<input
type="radio"
name="pay"
value="Cash on Delivery"
checked>

Cash on Delivery

</label>


<label class="pay">

<input
type="radio"
name="pay"
value="UPI">

UPI

</label>


<label class="pay">

<input
type="radio"
name="pay"
value="Pay at Shop / Pickup">

Pay at Shop / Pickup

</label>


<div class="small">

UPI payment can be connected after your
shop UPI ID/QR is added.

</div>


<button
class="primary"
onclick="placeOrder()">

Place Order

</button>

`;


document.getElementById('modalBg')
.classList.add('open');

}


function removeItem(i){

cart.splice(i,1);

if(cart.length)
openCheckout();
else
hideModal();

updateCart();

}


function placeOrder(){

const name=
document.getElementById('custName')
.value.trim();

const phone=
document.getElementById('custPhone')
.value.trim();

const address=
document.getElementById('custAddress')
.value.trim();

const pay=
document.querySelector(
'input[name="pay"]:checked'
).value;


if(!name || !phone || !address){

alert(
'Please fill name, mobile and address.'
);

return;

}


const orders=
JSON.parse(
localStorage.getItem('rps_orders')||'[]'
);


orders.unshift({

id:
'RPS'+
Date.now()
.toString()
.slice(-6),

date:
new Date()
.toLocaleString('en-IN'),

name,
phone,
address,
pay,

total:
cart.reduce((s,x)=>s+x.p,0),

items:
cart.map(x=>x.n)

});


localStorage.setItem(
'rps_orders',
JSON.stringify(orders)
);


cart=[];

updateCart();

hideModal();

alert(
'Order saved successfully! We will contact you to confirm.'
);

showOrders();

}


function showOrders(){

const orders=
JSON.parse(
localStorage.getItem('rps_orders')||'[]'
);


document.getElementById('modal').innerHTML=

`
<div class="modalTop">

<h3>My Orders</h3>

<button
class="close"
onclick="hideModal()">
×
</button>

</div>

${orders.length ?

orders.map(o=>`

<div class="orderCard">

<b>Order ${o.id}</b>

<br>

<span class="small">
${o.date}
</span>

<p>
${o.items.join(', ')}
</p>

<b>₹${o.total}</b>
•
${o.pay}

<br>

<span class="small">
${o.name} • ${o.phone}
</span>

</div>

`).join('')

:

'<p>No orders yet on this device.</p>'

}

`;


document.getElementById('modalBg')
.classList.add('open');

}


function hideModal(){

document.getElementById('modalBg')
.classList.remove('open');

}


function closeModal(e){

if(e.target.id==='modalBg')
hideModal();

}


render();


if('serviceWorker' in navigator){

window.addEventListener(
'load',
()=>navigator.serviceWorker
.register('./sw.js')
.catch(()=>{})
);

}

</script>

</body>
</html>
